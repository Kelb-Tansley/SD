name: Build MSI and upload to Azure Blob

on:
  push:
    branches:
      - master

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download InstallerProjects VSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:TEMP 'InstallerProjects2022.vsix'
          Invoke-WebRequest -Uri 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/VisualStudioClient/vsextensions/MicrosoftVisualStudio2022InstallerProjects/3.0.0/vspackage' -OutFile $out -UseBasicParsing
          Write-Host "Downloaded VSIX to $out"

      - name: Install InstallerProjects extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:TEMP 'InstallerProjects2022.vsix'
          $logFile = Join-Path $env:TEMP 'vsix-install.log'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $instanceJson = & $vswhere -latest -products * -format json | ConvertFrom-Json | Select-Object -First 1
            $instPath = $instanceJson.installationPath
            $instanceId = $instanceJson.instanceId
            $productId = $instanceJson.productId
            $installationVersion = $instanceJson.installationVersion
            $vsixInstaller = Join-Path $instPath 'Common7\IDE\VSIXInstaller.exe'
          } else {
            $vsixInstaller = 'C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\VSIXInstaller.exe'
            $instPath = 'C:\Program Files\Microsoft Visual Studio\18\Community'
            $instanceId = ''
            $productId = 'Microsoft.VisualStudio.Product.Community'
            $installationVersion = '18.0'
          }

          if (Test-Path $vsixInstaller) {
            Write-Host "Installing VSIX using $vsixInstaller"

            $skuName = switch -Regex ($productId) {
              'Enterprise$' { 'Enterprise' }
              'Professional$' { 'Pro' }
              'Community$' { 'Community' }
              default { '' }
            }

            $skuVersion = (($installationVersion -split '\.')[0..1] -join '.')

            $arguments = @(
              '/quiet'
              '/shutdownprocesses'
              '/appName:VS'
              "/skuName:$skuName"
              "/skuVersion:$skuVersion"
              "/logFile:$logFile"
            )

            if ($instanceId) {
              $arguments += "/instanceIds:$instanceId"
            }

            $arguments += $out

            Write-Host "VSIX arguments: $($arguments -join ' ')"

            $process = Start-Process -FilePath $vsixInstaller -ArgumentList $arguments -Wait -PassThru -NoNewWindow
            Write-Host "VSIX install exit code: $($process.ExitCode)"

            if (Test-Path $logFile) {
              Get-Content $logFile -Raw
            }

            if ($process.ExitCode -ne 0) {
              throw "VSIX installation failed with exit code $($process.ExitCode)"
            }
          } else {
            throw "VSIXInstaller not found at $vsixInstaller"
          }

      - name: Build MSI from Visual Studio installer project
        shell: pwsh
        run: ./infra/scripts/build-vdproj.ps1

      - name: Upload MSI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: artifacts/msi/*.msi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload MSI to blob storage
        shell: pwsh
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msiFiles = Get-ChildItem -Path 'artifacts/msi' -Filter *.msi -File
          if (-not $msiFiles) { throw 'No MSI files found in artifacts/msi' }

          foreach ($file in $msiFiles) {
            $blobName = "msi/$env:GITHUB_SHA/$($file.Name)"
            az storage blob upload `
              --auth-mode login `
              --account-name $env:AZURE_STORAGE_ACCOUNT `
              --container-name $env:AZURE_STORAGE_CONTAINER `
              --name $blobName `
              --file $file.FullName `
              --overwrite true
          }
